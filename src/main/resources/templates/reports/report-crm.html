<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layouts/main8}">
<section xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:fragment="content">
    <h2>Report by CRM</h2>
    <p>The report by managers</p>
    <hr/>
    <div class="row">
        <div class="col mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Block 1</h5>
                    <p class="card-text">Description 1</p>
                </div>
            </div>
        </div>
        <div class="col mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Block 2</h5>
                    <p class="card-text">Description 2</p>
                </div>
            </div>
        </div>
        <div class="col mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Block 3</h5>
                    <p class="card-text">Description 3</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 mb-3">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col">
                            <h5 class="card-title">Report by CRM [11]</h5>
                        </div>
                        <div class="col" style="text-align:right;"></div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                                <span th:text="${successMessage}"></span>
                            </div>
                        </div>
                    </div>
                    <div class="card-text">

                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th class="text-center align-middle" scope="col" >#</th>
                                    <th class="text-center align-middle" scope="col">Name</th>

                                    <th class="text-center align-middle" scope="col" >Clientes</th>
                                    <th class="text-center align-middle" scope="col" >Contacts</th>
                                    <th class="text-center align-middle" scope="col" >Activities</th>
                                    <th class="text-center align-middle" scope="col" >Deals</th>

                                    <th class="text-center align-middle" scope="col" >Days of work</th>

                                    <th class="text-center align-middle" scope="col" >Created</th>
                                    <th class="text-center align-middle" scope="col" >Updated</th>
                                    <th class="text-center align-middle" scope="col" style="width:350px;" >Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="itm : ${report}">
                                    <td class="text-center align-middle" th:text="${itm.id}">11</td>
                                    <td class="text-center align-middle">
                                        <a th:href="@{/users/view/{id}(id=${itm.owner.id})}" th:text="${itm.owner.displayname}"></a>
                                    </td>

                                    <td class="text-center align-middle" th:text="${itm.clients}">11</td>
                                    <td class="text-center align-middle" th:text="${itm.contacts}">11</td>
                                    <td class="text-center align-middle" th:text="${itm.activities}">11</td>
                                    <td class="text-center align-middle" th:text="${itm.deals}">11</td>

                                    <td class="text-center align-middle"
                                        th:text="${T(java.time.Duration).between(itm.createdAt, itm.updatedAt).toDays()}">
                                    </td>

                                    <td class="text-center align-middle"
                                        th:text="${itm.createdAt != null} ? ${#temporals.format(itm.createdAt, 'dd.MM.yyyy HH:mm')} : '-' ">
                                    </td>
                                    <td class="text-center align-middle"
                                        th:text="${itm.updatedAt != null} ? ${#temporals.format(itm.updatedAt, 'dd.MM.yyyy HH:mm')} : '-' ">
                                    </td>
                                    <td class="text-center align-middle">
                                        <a th:href="@{/users/edit/{id}(id=${itm.id})}" class="btn btn-primary mb-2 me-2" style="width:120px;">
                                            <i class="fas fa-pen me-1"></i> Edit
                                        </a>
                                        <a th:href="@{/users/delete/{id}(id=${itm.id})}" class="btn btn-danger mb-2" style="width:120px;">
                                            <i class="fas fa-trash me-1"></i> Delete
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">11</h5>
                    <p class="card-text">11111</p>
                </div>
            </div>
        </div>
        <div class="col-md-8 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">22</h5>
                    <p class="card-text">22222</p>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
